# @package _global_
# Training configuration for Simple Body Part VAE
# Uses minimal body-part-aware attention without extra parameters
# Should have similar training stability to standard VAE while benefiting from head grouping

defaults:
  - base
  - skeleton/g1
  - data/humanml3d_30fps
  - train/mvae
  - vae: simple_body_part_vae  # Use simplified body part VAE
  - _self_

# Experiment name
expname: HumanML3D-G1-23DOF-SimpleBodyPart-VAE
task: train-mvae

# Override nfeats to match dataset
nfeats: 57

# Number of CPU workers for data loading
num_workers: 0

# WandB logging configuration
train:
  manager:
    platform:
      _target_: robotmdar.train.train_platforms.WandBPlatform
      project: 23dofMVAE
      entity: null
      name: ${expname}
