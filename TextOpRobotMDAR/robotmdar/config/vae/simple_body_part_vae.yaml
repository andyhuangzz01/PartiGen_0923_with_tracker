# Simple Body Part VAE Configuration
# Minimal body-part-aware attention without extra parameters
# Should have similar training stability to standard VAE

_target_: robotmdar.model.body_part_mld_vae.BodyPartAutoMldVae

# Standard VAE parameters
nfeats: ${..nfeats}
latent_dim: [1, 128]
h_dim: 512
ff_size: 1024
num_layers: 9
num_heads: 8  # 8 heads / 4 parts = 2 heads per part
dropout: 0.1
arch: all_encoder
normalize_before: false
activation: gelu
position_embedding: learned

# Simple body part attention
use_body_part_attention: true
use_simple_attention: true  # NEW: use simplified version
num_body_parts: 4
use_kinematic_mask: false  # Keep false for simplicity

# Body part configuration (same as before)
body_part_config:
  left_legs: [0, 1, 2, 3, 4, 5]
  right_legs: [6, 7, 8, 9, 10, 11]
  torso: [12, 13, 14]
  upper_body: [15, 16, 17, 18, 19, 20, 21, 22]
