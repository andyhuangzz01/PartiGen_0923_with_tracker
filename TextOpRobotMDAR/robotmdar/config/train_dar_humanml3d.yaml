# @package _global_
# Training configuration for HumanML3D-G1-23DOF-30fps DAR
defaults:
  - base
  - skeleton/g1
  - data/humanml3d_30fps
  - train/dar
  - _self_

expname: HumanML3D-G1-23DOF-30fps-DAR
task: train-dar

# Override nfeats to match dataset (57 dims for 23DOF)
nfeats: 57

# Number of CPU workers for data loading
num_workers: 0

# VAE checkpoint will be set via command line
ckpt:
  vae: null  # Set this to your trained MVAE checkpoint path
  dar: null

# WandB configuration
train:
  manager:
    platform:
      _target_: robotmdar.train.train_platforms.WandBPlatform
      save_dir: ${..save_dir}
      project: 23dofMLD
      name: ${expname}-${now:%Y%m%d_%H%M%S}
