# @package _global_
# Training configuration for HumanML3D-G1-23DOF-30fps DAR with baseline VAE
defaults:
  - base
  - skeleton/g1
  - data/humanml3d_30fps
  - train/dar
  - _self_

expname: HumanML3D-G1-23DOF-DAR-baseline
task: train-dar

# Override nfeats to match dataset (57 dims for 23DOF)
nfeats: 57

# Number of CPU workers for data loading
num_workers: 0

# VAE checkpoint from baseline training (just completed)
ckpt:
  vae: /inspire/hdd/project/robot-hardware/gaoyue-p-gaoyue/hcx/TextOp/logs/RobotMDAR/HumanML3D-G1-23DOF-VAE-baseline/train-mvae-20260102_064301/ckpt_100000.pth
  dar: null

# WandB logging configuration
train:
  manager:
    platform:
      _target_: robotmdar.train.train_platforms.WandBPlatform
      save_dir: ${..save_dir}
      project: 23dofMVAE
      name: ${expname}-${now:%Y%m%d_%H%M%S}
