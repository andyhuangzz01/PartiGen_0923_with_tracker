# @package _global_
# Legacy experiment. The paper entry point is train_partigen_mvae.
# Training configuration for HumanML3D-G1-23DOF-30fps MVAE with Body Part Attention
# 
# This configuration trains a VAE with body-part-aware attention mechanism,
# which allows the model to learn different attention patterns for different
# body parts (left leg, right leg, torso, upper body).
#
# Usage:
#   python -m robotmdar.train.train_mvae --config-name train_mvae_humanml3d_23dof_bodypart
#
# Key differences from standard VAE:
#   - Uses BodyPartAutoMldVae instead of AutoMldVae
#   - Attention heads are grouped by body parts
#   - Optional kinematic chain constraints

defaults:
  - base
  - skeleton/g1
  - data/humanml3d_30fps
  - train/mvae
  - vae: body_part_skip_vae  # Use body-part-aware VAE
  - _self_

# Experiment name - clearly indicates body part attention is used
expname: HumanML3D-G1-23DOF-BodyPart-VAE-v2
task: train-mvae

# Override nfeats to match dataset (57 dims for 23DOF)
# V3 layout: orientation(5) + contact(2) + local_displacement(3) + height(1) + q(23) + delta_q(23).
nfeats: 57

# Number of CPU workers for data loading
# Set to 0 due to /dev/shm limitation (only 64MB)
# To use multi-worker, run: sudo mount -o remount,size=32G /dev/shm
num_workers: 0

# WandB logging configuration
train:
  manager:
    platform:
      _target_: robotmdar.train.train_platforms.WandBPlatform
      project: 23dofMVAE
      entity: null
      name: ${expname}

# Optional: Override body part attention parameters
# Uncomment and modify as needed
# vae:
#   num_body_parts: 4
#   use_kinematic_mask: true  # Enable kinematic constraints
#   num_heads: 8  # Increase heads (must be divisible by num_body_parts)
