# Configuration for HumanML3D-G1-23DOF-30fps dataset with DeepSeek Body Part Annotations
skeleton: ${..skeleton}

nfeats: 57 # V3: orientation(5) + contact(2) + local_displacement(3) + height(1) + q(23) + delta_q(23)
history_len: 2
future_len: 8
num_primitive: 8
batch_size: 512

# Enable body part weighted sampling
weighted_sample: true
frame_weight: false
use_weighted_meanstd: false
use_body_part_weighting: true  # New flag for body part based weighting

# Body part weights for weighted sampling
# These weights will be applied based on the 'primary_parts' field in body_part_annotation
body_part_weights:
  head: 2.0
  left_arm: 1.5
  right_arm: 1.5
  left_hand: 1.8
  right_hand: 1.8
  torso: 1.0
  left_leg: 1.2
  right_leg: 1.2

# Update these paths for your annotated dataset
action_statistics_path: ./dataset/HumanML3D-G1-23DOF-30fps/action_statistics.json
datadir: ./dataset/HumanML3D-G1-23DOF-30fps

common: &common
  _target_: robotmdar.dataloader.data.SkeletonPrimitiveDataset
  datadir: ${..datadir}
  action_statistics_path: ${..action_statistics_path}

  robot_cfg: ${skeleton}
  device: cuda
  nfeats: ${..nfeats}
  history_len: ${..history_len}
  future_len: ${..future_len}
  num_primitive: ${..num_primitive}
  batch_size: ${..batch_size}
  weighted_sample: ${..weighted_sample}
  frame_weight: ${..frame_weight}
  use_weighted_meanstd: ${..use_weighted_meanstd}
  use_body_part_weighting: ${..use_body_part_weighting}
  body_part_weights: ${..body_part_weights}

train:
  <<: *common
  split: train
  # Use the deepseek annotated pickle file
  data_suffix: _deepseek_annotated

val:
  <<: *common
  split: val
  data_suffix: _deepseek_annotated

